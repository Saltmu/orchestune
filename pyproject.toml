[project]
name = "orchestune"
version = "0.5.0"
description = "Multi-agent implementation orchestrator (DAG construction, dispatch cycles, self-healing)"
authors = [{ name = "Saltmu" }]
requires-python = ">=3.12,<4.0"
dependencies = ["pyyaml>=6.0.3,<7.0.0"]

[project.scripts]
orchestune = "orchestune.cli:main"
orchestune-dispatch = "orchestune.dispatch.dispatcher:main"
orchestune-dag = "orchestune.dag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2.2,<10.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.4.10,<0.5.0",
    "mypy>=1.10.1,<2.0.0",
    "types-pyyaml>=6.0.12.20240311,<7.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["orchestune"]

[tool.hatch.build.targets.wheel.force-include]
"skills/orchestune" = "skills/orchestune"
"skills/orchestune-provision" = "skills/orchestune-provision"
"skills/orchestune-dispatch" = "skills/orchestune-dispatch"
"skills/workflow-template" = "skills/workflow-template"

[tool.hatch.build.targets.sdist]
only-include = ["orchestune"]

[tool.hatch.build.targets.sdist.force-include]
"skills/orchestune" = "skills/orchestune"
"skills/orchestune-provision" = "skills/orchestune-provision"
"skills/orchestune-dispatch" = "skills/orchestune-dispatch"
"skills/workflow-template" = "skills/workflow-template"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# Retained for `tests/`, not for `orchestune/`: since orchestune/__init__.py was
# added (#297) the package resolves on its own, but tests/ has no __init__.py, so
# tests/conftest.py would otherwise be found twice as "conftest" and
# "tests.conftest". Drop this only together with making tests/ a package.
explicit_package_bases = true

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-n auto --maxprocesses=8"
markers = [
    "uses_real_file_lock: exercises the real fcntl-based Integrator worktree lock instead of the autouse no-op stub",
    "integration: shells out to a real git binary via subprocess instead of mocking it, so it's slower than the unit-test default",
    "unit: exercises an isolated module, class, or function without crossing a real infrastructure boundary",
    "e2e: exercises a public CLI or major workflow from its entry point through the resulting outcome",
]

[tool.detect-bloat]
code_paths = ["orchestune"]
test_paths = ["tests"]
skills_path = "skills"
code_file_lines = 1000
test_file_lines = 1000
skill_directory_lines = 500
function_lines = 50

[tool.coverage.run]
branch = true
source = ["orchestune"]
