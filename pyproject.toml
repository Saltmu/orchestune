[tool.poetry]
name = "orchestune"
version = "0.5.0"
description = "Multi-agent implementation orchestrator (DAG construction, dispatch cycles, self-healing)"
authors = ["Saltmu"]
packages = [{include = "orchestune"}]
include = [
    { path = "skills/orchestune", format = ["sdist", "wheel"] },
    { path = "skills/orchestune-provision", format = ["sdist", "wheel"] },
    { path = "skills/orchestune-dispatch", format = ["sdist", "wheel"] },
    { path = "skills/workflow-template", format = ["sdist", "wheel"] }
]

[tool.poetry.dependencies]
python = "^3.12"
pyyaml = "^6.0.3"

[tool.poetry.scripts]
orchestune = "orchestune.cli:main"
orchestune-dispatch = "orchestune.dispatch.dispatcher:main"
orchestune-dag = "orchestune.dag.cli:main"


[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.2,<10.0.0"
pytest-cov = "^5.0.0"
ruff = "^0.4.10"
mypy = "^1.10.1"
types-pyyaml = "^6.0.12.20240311"
pytest-xdist = "^3.8.0"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# Retained for `tests/`, not for `orchestune/`: since orchestune/__init__.py was
# added (#297) the package resolves on its own, but tests/ has no __init__.py, so
# tests/conftest.py would otherwise be found twice as "conftest" and
# "tests.conftest". Drop this only together with making tests/ a package.
explicit_package_bases = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-n auto --maxprocesses=8"
markers = [
    "uses_real_file_lock: exercises the real fcntl-based Integrator worktree lock instead of the autouse no-op stub",
    "integration: shells out to a real git binary via subprocess instead of mocking it, so it's slower than the unit-test default",
]

[tool.detect-bloat]
code_paths = ["orchestune"]
test_paths = ["tests"]
skills_path = "skills"
code_file_lines = 1000
test_file_lines = 1000
skill_directory_lines = 500
function_lines = 50

[tool.coverage.run]
branch = true
source = ["orchestune"]
