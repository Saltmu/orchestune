name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read


jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets and local paths (gitleaks)
        if: runner.os == 'Linux'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Poetry
        run: |
          pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install dependencies
        run: |
          poetry install --no-interaction

      - name: Run CI checks (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/local-ci.sh
          ./scripts/local-ci.sh

      - name: Run CI checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/local-ci.ps1
