name: Claude Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    # Runs when someone comments "@claude review" on a pull request. Human
    # actors are unrestricted. A bot actor is only accepted when it is
    # exactly `claude[bot]` (matching the `allowed_bots` grant below) and the
    # comment carries the Orchestune trigger marker that
    # scripts/wait_for_review.py stamps on its own trigger comments — this
    # keeps Claude Code on the Web's bot-authored `@claude review` requests
    # working while (a) skipping the job entirely for any other bot actor
    # instead of letting claude-code-action hard-fail, and (b) preventing the
    # action's own track_progress / final / inline comments (which never
    # carry the marker) from re-triggering a review. See issue #692.
    if: |
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
        github.event_name == 'pull_request_review_comment'
      ) &&
      contains(github.event.comment.body, '@claude') &&
      contains(github.event.comment.body, 'review') &&
      (
        !endsWith(github.actor, '[bot]') ||
        (
          github.actor == 'claude[bot]' &&
          contains(github.event.comment.body, '<!-- orchestune:review-trigger bot=claude -->')
        )
      )

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine pull request number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Minimal allow-list: only the official Claude GitHub App identity
          # may trigger this action as a bot actor. Never widen to '*' or add
          # other bots here without a real, verified posting path for them
          # (see docs/security.md in anthropics/claude-code-action: allowed
          # bots are not checked for repository write access).
          allowed_bots: 'claude[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ steps.pr.outputs.number }} --comment'
          track_progress: true
          # The code-review plugin's own command frontmatter declares these
          # tools as allowed, but the action's headless execution does not
          # honor that automatically — they must be granted here too, or
          # every gh/inline-comment call is silently permission-denied and
          # nothing gets posted to the PR (see anthropics/claude-code-action#1523).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr list:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

